<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบความรู้คอมพิวเตอร์เบื้องต้น The Great Tutor ติวสอบทหาร ตำรวจ อุบล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B;
    --ink-2:#16273D;
    --ink-3:#1E3350;
    --line:#2A3E5C;
    --text:#EDF1F5;
    --muted:#8FA0B8;
    --gold:#E4B43C;
    --gold-dim:#8a712c;
    --green:#4FAE7D;
    --red:#E2634F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #17304f 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #14243a 0%, transparent 50%),
      var(--ink);
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    max-width:760px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  /* ===== Header / masthead ===== */
  .masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:28px;
  }
  .masthead .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .masthead h1{
    font-size:26px;
    font-weight:800;
    margin:0;
    line-height:1.25;
  }
  .masthead .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    text-align:right;
    white-space:nowrap;
  }

  /* ===== Landing: category seals ===== */
  .intro-text{
    color:var(--muted);
    font-size:15px;
    line-height:1.75;
    margin-bottom:28px;
  }
  .full-test-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background:linear-gradient(135deg,#233a5c,#182b47);
    border:1px solid var(--gold-dim);
    color:var(--text);
    border-radius:var(--radius);
    padding:18px 22px;
    cursor:pointer;
    font-family:'Sarabun',sans-serif;
    text-align:left;
    margin-bottom:26px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .full-test-btn:hover{ transform:translateY(-2px); border-color:var(--gold); }
  .full-test-btn .ft-title{ font-size:17px; font-weight:700; }
  .full-test-btn .ft-sub{ font-size:12.5px; color:var(--muted); margin-top:4px; font-family:'IBM Plex Mono',monospace; }
  .full-test-btn .ft-arrow{ font-size:22px; color:var(--gold); }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:6px 0 12px;
  }

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:520px){ .cat-grid{ grid-template-columns:1fr; } }

  .cat-card{
    position:relative;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    transition:border-color .15s ease, transform .15s ease;
    overflow:hidden;
  }
  .cat-card:hover{ border-color:var(--gold-dim); transform:translateY(-2px); }
  .cat-card .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--gold);
    letter-spacing:.1em;
  }
  .cat-card .title{
    font-size:15.5px;
    font-weight:700;
    margin:6px 0 8px;
    line-height:1.35;
  }
  .cat-card .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .cat-card .seal{
    position:absolute;
    right:-10px; top:-10px;
    width:64px;height:64px;
    border-radius:50%;
    border:1.5px dashed var(--line);
    opacity:.5;
  }

  /* ===== Quiz screen ===== */
  .quiz-topbar{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .quiz-topbar .exit{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    background:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    cursor:pointer;
  }
  .quiz-topbar .exit:hover{ border-color:var(--gold-dim); color:var(--text); }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--ink-3);
    border-radius:4px;
    overflow:hidden;
    display:flex;
    gap:2px;
  }
  .progress-seg{
    flex:1;
    height:100%;
    background:var(--line);
    border-radius:2px;
  }
  .progress-seg.done{ background:var(--gold); }
  .quiz-topbar .score{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--gold);
    white-space:nowrap;
  }

  .q-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
    margin-bottom:10px;
  }
  .q-code .tag{
    color:var(--gold);
  }
  .q-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px 22px;
  }
  .q-text{
    font-size:19px;
    font-weight:600;
    line-height:1.55;
    margin:0 0 20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 15px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover:not(.locked){ border-color:var(--gold-dim); }
  .opt .letter{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    color:var(--gold);
    width:22px;
    height:22px;
    border:1px solid var(--gold-dim);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .opt.correct{ background:rgba(79,174,125,.16); border-color:var(--green); }
  .opt.correct .letter{ background:var(--green); color:#0E1A2B; border-color:var(--green); }
  .opt.wrong{ background:rgba(226,99,79,.14); border-color:var(--red); }
  .opt.wrong .letter{ background:var(--red); color:#0E1A2B; border-color:var(--red); }
  .opt.locked{ cursor:default; }
  .opt.dim{ opacity:.5; }

  .feedback-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
    min-height:38px;
  }
  .feedback-text{
    font-size:13.5px;
    font-family:'IBM Plex Mono',monospace;
  }
  .feedback-text.ok{ color:var(--green); }
  .feedback-text.no{ color:var(--red); }
  .next-btn{
    background:var(--gold);
    color:#1a1305;
    border:none;
    border-radius:9px;
    padding:11px 22px;
    font-family:'Sarabun',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .next-btn:hover{ filter:brightness(1.08); }

  /* ===== Result screen ===== */
  .result-wrap{ text-align:center; padding-top:10px; }
  .stamp{
    width:150px; height:150px;
    margin:10px auto 22px;
    border-radius:50%;
    border:3px solid var(--gold);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    position:relative;
    transform:rotate(-6deg);
  }
  .stamp::before{
    content:"";
    position:absolute; inset:8px;
    border:1px dashed var(--gold-dim);
    border-radius:50%;
  }
  .stamp .stamp-pct{
    font-family:'IBM Plex Mono',monospace;
    font-size:34px;
    font-weight:600;
    color:var(--gold);
  }
  .stamp .stamp-label{
    font-size:13px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:.06em;
    margin-top:2px;
  }
  .result-headline{
    font-size:22px;
    font-weight:800;
    margin:0 0 6px;
  }
  .result-sub{
    color:var(--muted);
    font-size:14.5px;
    margin-bottom:30px;
  }
  .breakdown{
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:30px;
  }
  .bd-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
  }
  .bd-row .bd-name{ flex:1; font-size:13.5px; }
  .bd-row .bd-bar{
    width:120px; height:6px;
    background:var(--ink-3);
    border-radius:4px;
    overflow:hidden;
  }
  .bd-row .bd-fill{ height:100%; background:var(--gold); }
  .bd-row .bd-score{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
    width:44px;
    text-align:right;
  }
  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn{
    font-family:'Sarabun',sans-serif;
    font-weight:700;
    font-size:14.5px;
    border-radius:9px;
    padding:12px 22px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--ink-2);
    color:var(--text);
  }
  .btn.primary{ background:var(--gold); color:#1a1305; border:none; }
  .btn:hover{ border-color:var(--gold-dim); }

  .review-list{ text-align:left; margin-top:34px; display:none; flex-direction:column; gap:10px; }
  .review-list.show{ display:flex; }
  .review-item{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .review-item .rq{ font-size:14px; font-weight:600; margin-bottom:6px; }
  .review-item .ra{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .review-item .ra.your{ color:var(--red); }
  .review-item .ra.right{ color:var(--green); margin-top:2px; }

  .hidden{ display:none !important; }
  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    margin-top:40px;
    opacity:.6;
  }

.login-card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px}
.login-card label,.dcard label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
input,select{background:var(--ink-3);border:1px solid var(--line);border-radius:9px;padding:12px 13px;color:var(--text);font:16px 'Sarabun',sans-serif}
input:focus,select:focus{outline:2px solid var(--gold-dim);border-color:var(--gold)}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.2em}
.err{color:var(--red);font-size:13.5px;min-height:18px}
.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.dcard{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.dcard h3{margin:0 0 12px;font-size:16px}
.frow{display:grid;grid-template-columns:2fr 1fr 1.4fr auto;gap:10px;align-items:end}
@media(max-width:600px){.frow{grid-template-columns:1fr}}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;background:var(--ink-3)}
.srow.sel{border-color:var(--gold)}
.srow .sn{flex:1;font-weight:600;font-size:14.5px}.srow small{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--green);color:var(--green)}.pill.off{border-color:var(--red);color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--ink-3);border-radius:10px;padding:12px}.kpi b{display:block;font:600 24px 'IBM Plex Mono',monospace;color:var(--gold)}.kpi span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500;font-size:12px}
td.n{font-family:'IBM Plex Mono',monospace}.sm{padding:7px 12px;font-size:13px}
.hbar{height:8px;background:var(--ink-3);border-radius:4px;overflow:hidden;flex:1}.hbar i{display:block;height:100%;background:var(--gold)}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div class="stage">

  <div class="masthead">
    <div>
      <div class="kicker">แบบทดสอบออนไลน์</div>
      <h1>ความรู้คอมพิวเตอร์เบื้องต้น</h1>
    </div>
    <div class="code" id="masthead-code">EX-2026-IT100</div>
  </div>

  <!-- ===== LANDING ===== -->
  <div id="screen-landing">
    <p class="intro-text">กรอกชื่อและ PIN ที่ผู้ติวให้ เพื่อเริ่มทำแบบทดสอบ คะแนนจะถูกส่งให้ผู้ติวอัตโนมัติเมื่อทำเสร็จ</p>
    <div class="login-card">
      <label>ชื่อ-นามสกุล<input id="in-name" maxlength="60" autocomplete="name" placeholder="เช่น สมชาย ใจดี"></label>
      <label>PIN ของการสอบ<input id="in-pin" inputmode="numeric" maxlength="8" placeholder="ตัวเลข 4–8 หลัก" class="mono"></label>
      <div class="err" id="login-err"></div>
      <button class="btn primary" id="enter-btn" onclick="enterTest()">เข้าสู่การสอบ →</button>
    </div>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-topbar">
      <button class="exit" onclick="exitQuiz()">← ออกจากแบบทดสอบ</button>
      <div class="progress-track" id="progress-track"></div>
      <div class="score" id="live-score">0/0</div>
    </div>
    <div class="q-code" id="q-code"></div>
    <div class="q-card">
      <p class="q-text" id="q-text"></p>
      <div class="options" id="q-options"></div>
      <div class="feedback-row">
        <div class="feedback-text" id="feedback-text"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">ข้อถัดไป →</button>
      </div>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="screen-result" class="hidden">
    <div class="result-wrap">
      <div class="stamp" id="stamp">
        <div class="stamp-pct" id="stamp-pct">0%</div>
        <div class="stamp-label" id="stamp-label">ผ่าน</div>
      </div>
      <h2 class="result-headline" id="result-headline"></h2>
      <p class="result-sub" id="result-sub"></p>

      <div class="breakdown" id="breakdown"></div>

      <div class="result-actions">
        
        <button class="btn" onclick="showReview()">ดูข้อที่ตอบผิด</button>
        <button class="btn" onclick="backToLanding()">กลับหน้าหลัก</button>
      </div>

      <div class="review-list" id="review-list"></div>
    </div>
  </div>

  <div id="screen-dash" class="hidden">
    <div class="dash-head"><a href="#" class="exit" style="text-decoration:none">← หน้านักเรียน</a><span class="mono" style="color:var(--gold)">แดชบอร์ดผู้ติว</span></div>
    <div id="dash-body"><p class="intro-text">กำลังโหลด…</p></div>
  </div>
  <div class="footer-note">ระบบทดสอบนี้ทำงานในเบราว์เซอร์ · <a href="#tutor" style="color:inherit">สำหรับผู้ติว</a></div>
</div>

<script>
const LETTERS = ['ก','ข','ค','ง'];

const CATEGORIES = [
{
  name: "ฮาร์ดแวร์และสถาปัตยกรรมคอมพิวเตอร์",
  short: "หมวด 1 · ฮาร์ดแวร์",
  questions: [
    ["อุปกรณ์ใดทำหน้าที่เป็นศูนย์กลางในการเชื่อมต่ออุปกรณ์คอมพิวเตอร์ทั้งหมดเข้าด้วยกัน?", ["CPU","Mainboard","Hard Disk","RAM"], 1],
    ["หน่วยประมวลผลกลาง (CPU) มีหน้าที่หลักคืออะไร?", ["จัดเก็บข้อมูลถาวร","แสดงผลภาพ","คำนวณและประมวลผลคำสั่ง","เชื่อมต่อเครือข่าย"], 2],
    ["ข้อใดคือหน่วยความจำหลักที่ข้อมูลจะสูญหายทันทีเมื่อไม่มีกระแสไฟฟ้า?", ["ROM","Flash Drive","Hard Disk","RAM"], 3],
    ["อุปกรณ์ในข้อใดเป็นทั้งอุปกรณ์รับและแสดงผลข้อมูล (Input/Output Device)?", ["Keyboard","Monitor","Touch Screen","Printer"], 2],
    ["พอร์ตประเภทใดที่นิยมใช้เชื่อมต่อจอภาพเพื่อให้ได้ความละเอียดสูงในปัจจุบัน?", ["VGA","HDMI","PS/2","Serial Port"], 1],
    ["ข้อใดคืออุปกรณ์จัดเก็บข้อมูลแบบ Solid State ที่ทำงานเร็วกว่าฮาร์ดดิสก์แบบจานหมุน?", ["HDD","SSD","CD-ROM","Floppy Disk"], 1],
    ["ขนาดของข้อมูล 1 กิกะไบต์ (GB) มีค่าเท่ากับข้อใด?", ["1,024 MB","1,024 KB","1,000 MB","1,000 KB"], 0],
    ["อุปกรณ์ใดทำหน้าที่แปลงสัญญาณดิจิทัลเป็นอนาล็อก และอนาล็อกเป็นดิจิทัล?", ["Router","Switch","Modem","Hub"], 2],
    ["ข้อใดจัดเป็นฮาร์ดแวร์ทั้งหมด?", ["เมาส์, วินโดวส์, คีย์บอร์ด","จอภาพ, แรม, ซีพียู","เครื่องพิมพ์, เวิร์ด, ฮาร์ดดิสก์","สแกนเนอร์, ไลน์, ลำโพง"], 1],
    ["ปุ่มใดบนคีย์บอร์ดที่ใช้สำหรับลบตัวอักษรที่อยู่ด้านขวาของเคอร์เซอร์?", ["Backspace","Delete","Insert","Spacebar"], 1],
    ["การทำงานของเครื่องสแกนเนอร์ (Scanner) จัดอยู่ในหน่วยใดของคอมพิวเตอร์?", ["หน่วยรับข้อมูล","หน่วยแสดงผล","หน่วยประมวลผล","หน่วยความจำ"], 0],

// ---------- state ----------
let quizQueue = [];      // list of {catIdx, qIdx}
let current = 0;
let selectedAnswers = []; // parallel to quizQueue: null or chosen index
let quizLabel = "";

// ---------- landing render ----------
function renderLanding(){
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach((cat, i)=>{
    const card = document.createElement('button');
    card.className = 'cat-card';
    card.onclick = ()=>startQuiz(i);
    card.innerHTML = `
      <div class="seal"></div>
      <div class="num">หมวด ${String(i+1).padStart(2,'0')}</div>
      <div class="title">${cat.name}</div>
      <div class="count">${cat.questions.length} ข้อ</div>
    `;
    grid.appendChild(card);
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(catIdx){
  quizQueue = [];
  if(catIdx===null){
    quizLabel = "ข้อสอบเต็มรูปแบบ";
    CATEGORIES.forEach((cat,ci)=>{
      cat.questions.forEach((q,qi)=>quizQueue.push({catIdx:ci, qIdx:qi}));
    });
  } else {
    quizLabel = CATEGORIES[catIdx].name;
    CATEGORIES[catIdx].questions.forEach((q,qi)=>quizQueue.push({catIdx, qIdx:qi}));
  }
  selectedAnswers = new Array(quizQueue.length).fill(null);
  current = 0;
  document.getElementById('screen-landing').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  buildProgress();
  renderQuestion();
}

function buildProgress(){
  const track = document.getElementById('progress-track');
  track.innerHTML = '';
  quizQueue.forEach(()=>{
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    track.appendChild(seg);
  });
}

function updateProgress(){
  const segs = document.querySelectorAll('.progress-seg');
  segs.forEach((s,i)=>{
    s.classList.toggle('done', i<=current && selectedAnswers[i]!==null);
  });
  const answeredCount = selectedAnswers.filter(a=>a!==null).length;
  const correctCount = selectedAnswers.reduce((acc,a,i)=>{
    if(a===null) return acc;
    const item = quizQueue[i];
    const correct = CATEGORIES[item.catIdx].questions[item.qIdx][2];
    return acc + (a===correct?1:0);
  },0);
  document.getElementById('live-score').textContent = `${correctCount}/${answeredCount}`;
}

function renderQuestion(){
  const item = quizQueue[current];
  const cat = CATEGORIES[item.catIdx];
  const [qText, opts, ansIdx] = cat.questions[item.qIdx];

  document.getElementById('q-code').innerHTML =
    `ข้อ ${String(current+1).padStart(3,'0')} / ${String(quizQueue.length).padStart(3,'0')} &nbsp;·&nbsp; <span class="tag">${cat.short}</span>`;
  document.getElementById('q-text').textContent = qText;

  const optWrap = document.getElementById('q-options');
  optWrap.innerHTML = '';
  const chosen = selectedAnswers[current];

  opts.forEach((optText, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${optText}</span>`;
    if(chosen!==null){
      btn.classList.add('locked');
      if(idx===ansIdx) btn.classList.add('correct');
      else if(idx===chosen) btn.classList.add('wrong');
      else btn.classList.add('dim');
    } else {
      btn.onclick = ()=>selectAnswer(idx);
    }
    optWrap.appendChild(btn);
  });

  const fb = document.getElementById('feedback-text');
  const nextBtn = document.getElementById('next-btn');
  if(chosen!==null){
    if(chosen===ansIdx){
      fb.textContent = '✓ ตอบถูกต้อง';
      fb.className = 'feedback-text ok';
    } else {
      fb.textContent = `✗ ตอบผิด — เฉลยคือ ${LETTERS[ansIdx]}`;
      fb.className = 'feedback-text no';
    }
    nextBtn.classList.add('show');
    nextBtn.textContent = (current===quizQueue.length-1) ? 'ดูผลสรุป →' : 'ข้อถัดไป →';
  } else {
    fb.textContent = '';
    nextBtn.classList.remove('show');
  }
  updateProgress();
}

function selectAnswer(idx){
  selectedAnswers[current] = idx;
  renderQuestion();
}

function nextQuestion(){
  if(current < quizQueue.length-1){
    current++;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    showResult();
  }
}

function exitQuiz(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-landing').classList.remove('hidden');
}

function backToLanding(){
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-landing').classList.remove('hidden');
  window.scrollTo({top:0});
}

function restartSame(){
  selectedAnswers = new Array(quizQueue.length).fill(null);
  current = 0;
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  document.getElementById('review-list').classList.remove('show');
  buildProgress();
  renderQuestion();
  window.scrollTo({top:0});
}

function showResult(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');

  const total = quizQueue.length;
  let correct = 0;
  const perCat = {};
  quizQueue.forEach((item,i)=>{
    const ansIdx = CATEGORIES[item.catIdx].questions[item.qIdx][2];
    const catName = CATEGORIES[item.catIdx].short;
    if(!perCat[catName]) perCat[catName] = {correct:0,total:0};
    perCat[catName].total++;
    if(selectedAnswers[i]===ansIdx){ correct++; perCat[catName].correct++; }
  });
  const pct = Math.round((correct/total)*100);

  const stamp = document.getElementById('stamp');
  const stampLabel = document.getElementById('stamp-label');
  document.getElementById('stamp-pct').textContent = pct + '%';
  if(pct>=80){ stampLabel.textContent='ผ่าน'; stamp.style.borderColor='var(--green)'; document.getElementById('stamp-pct').style.color='var(--green)'; stampLabel.style.color='var(--green)'; }
  else if(pct>=50){ stampLabel.textContent='พอใช้'; stamp.style.borderColor='var(--gold)'; document.getElementById('stamp-pct').style.color='var(--gold)'; stampLabel.style.color='var(--gold)'; }
  else { stampLabel.textContent='ควรทบทวน'; stamp.style.borderColor='var(--red)'; document.getElementById('stamp-pct').style.color='var(--red)'; stampLabel.style.color='var(--red)'; }

  document.getElementById('result-headline').textContent = `ทำถูก ${correct} จาก ${total} ข้อ`;
  document.getElementById('result-sub').textContent = `${quizLabel} · คะแนนรวม ${pct}%`;

  const bdWrap = document.getElementById('breakdown');
  bdWrap.innerHTML = '';
  Object.entries(perCat).forEach(([name, d])=>{
    const row = document.createElement('div');
    row.className = 'bd-row';
    const fillPct = Math.round((d.correct/d.total)*100);
    row.innerHTML = `
      <div class="bd-name">${name}</div>
      <div class="bd-bar"><div class="bd-fill" style="width:${fillPct}%"></div></div>
      <div class="bd-score">${d.correct}/${d.total}</div>
    `;
    bdWrap.appendChild(row);
  });

  // build review list (hidden until requested)
  const reviewWrap = document.getElementById('review-list');
  reviewWrap.innerHTML = '';
  reviewWrap.classList.remove('show');
  quizQueue.forEach((item,i)=>{
    const [qText, opts, ansIdx] = CATEGORIES[item.catIdx].questions[item.qIdx];
    if(selectedAnswers[i]!==ansIdx){
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = `
        <div class="rq">${qText}</div>
        <div class="ra your">คุณตอบ: ${selectedAnswers[i]===null?'ไม่ได้ตอบ':LETTERS[selectedAnswers[i]]+'. '+opts[selectedAnswers[i]]}</div>
        <div class="ra right">เฉลย: ${LETTERS[ansIdx]}. ${opts[ansIdx]}</div>
      `;
      reviewWrap.appendChild(div);
    }
  });
  if(reviewWrap.innerHTML===''){
    reviewWrap.innerHTML = '<div class="review-item">ยินดีด้วย ตอบถูกทุกข้อ 🎉</div>';
  }
  window.scrollTo({top:0});
}

function showReview(){
  document.getElementById('review-list').classList.add('show');
}

// ================= online layer (Google Apps Script) =================
const API_URL='https://script.google.com/macros/s/AKfycbxoNPl-aFj-u2icXamgxwUZgXKMyjcPtNDewrxmOM14YF3O0ZLVCh6D50ZOFrlbMso7/exec';   // <-- ใส่ Web app URL จาก Apps Script
async function api(body){
  if(API_URL.startsWith('PASTE')) throw new Error('noconfig');
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});
  return await r.json();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let currentSession=null, studentName='', studentPin='', saved=false;
function setErr(m){document.getElementById('login-err').textContent=m||''}

async function enterTest(){
  const name=document.getElementById('in-name').value.trim(), pin=document.getElementById('in-pin').value.trim();
  if(name.length<2) return setErr('กรอกชื่อ-นามสกุลก่อนเริ่มสอบ');
  if(!/^\d{4,8}$/.test(pin)) return setErr('PIN เป็นตัวเลข 4–8 หลัก');
  const btn=document.getElementById('enter-btn'); btn.disabled=true; setErr('');
  try{
    const r=await api({a:'verify',pin});
    if(!r.ok){setErr('PIN ไม่ถูกต้อง หรือผู้ติวปิดการสอบแล้ว');return}
    currentSession=r; studentName=name; studentPin=pin; saved=false;
    startQuiz(r.cat>=0?r.cat:null); window.scrollTo({top:0});
  }catch(e){ setErr(e.message==='noconfig'?'ยังไม่ได้ตั้งค่า API_URL ในไฟล์':'เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่') }
  finally{btn.disabled=false}
}

const _showResult=showResult;
showResult=function(){
  _showResult();
  if(!currentSession||saved) return;
  const perCat={}; let correct=0;
  quizQueue.forEach((it,i)=>{const ok=selectedAnswers[i]===CATEGORIES[it.catIdx].questions[it.qIdx][2];
    const k=CATEGORIES[it.catIdx].short; perCat[k]=perCat[k]||{c:0,t:0}; perCat[k].t++; if(ok){perCat[k].c++;correct++}});
  const payload={a:'submit',pin:studentPin,name:studentName,score:correct,total:quizQueue.length,perCat};
  const sub=document.getElementById('result-sub'), base=sub.textContent;
  const send=async()=>{
    sub.textContent=base+' · กำลังส่งคะแนน…';
    try{ const r=await api(payload); if(!r.ok) throw 0; saved=true; sub.textContent=base+' · ส่งคะแนนให้ผู้ติวแล้ว ✓'; }
    catch(e){ sub.innerHTML=esc(base)+' · <span style="color:var(--red)">ส่งคะแนนไม่สำเร็จ</span> <button class="btn" style="padding:4px 12px;font-size:13px" id="retry-btn">ส่งอีกครั้ง</button>'; document.getElementById('retry-btn').onclick=send; }
  };
  send();
};

// ================= tutor dashboard =================
let adminKey=sessionStorage.getItem('ak')||'', sessions=[], results=[], selId=null, timer=null;
function route(){
  const tutor=location.hash==='#tutor';
  document.getElementById('screen-dash').classList.toggle('hidden',!tutor);
  if(tutor){ ['screen-landing','screen-quiz','screen-result'].forEach(id=>document.getElementById(id).classList.add('hidden')); dashStart(); }
  else { clearInterval(timer); if(document.getElementById('screen-quiz').classList.contains('hidden')&&document.getElementById('screen-result').classList.contains('hidden')) document.getElementById('screen-landing').classList.remove('hidden'); }
}
window.addEventListener('hashchange',route); route();

function dashStart(){
  clearInterval(timer);
  const body=document.getElementById('dash-body');
  if(!adminKey){
    body.innerHTML='<div class="login-card"><label>รหัสผู้ติว (ADMIN_KEY)<input id="ak" type="password"></label><div class="err" id="ak-err"></div><button class="btn primary" onclick="setKey()">เข้าสู่แดชบอร์ด</button></div>';
    return;
  }
  drawShell(); refresh(); timer=setInterval(refresh,8000);
}
async function setKey(){ adminKey=document.getElementById('ak').value; sessionStorage.setItem('ak',adminKey); dashStart(); }
async function refresh(){
  try{
    const r=await api({a:'list',key:adminKey});
    if(r.err==='auth'){adminKey='';sessionStorage.removeItem('ak');dashStart();const e=document.getElementById('ak-err');if(e)e.textContent='รหัสไม่ถูกต้อง';return}
    if(!r.ok) return;
    sessions=r.sessions; results=r.results; if(!selId&&sessions[0]) selId=sessions[0].id;
    drawSessions(); drawResults();
  }catch(e){ const l=document.getElementById('s-list'); if(l&&!sessions.length) l.innerHTML='<small style="color:var(--red)">เชื่อมต่อระบบไม่ได้ (ตรวจ API_URL และการ Deploy)</small>'; }
}
function drawShell(){
  const opts='<option value="-1">ข้อสอบเต็ม 100 ข้อ</option>'+CATEGORIES.map((c,i)=>`<option value="${i}">${esc(c.short)} (${c.questions.length} ข้อ)</option>`).join('');
  document.getElementById('dash-body').innerHTML=`
  <div class="dcard"><h3>สร้างรอบสอบใหม่</h3>
    <div class="frow"><label>ชื่อรอบสอบ<input id="s-title" placeholder="เช่น ติวรอบ 22 พ.ย."></label>
    <label>PIN (4–8 หลัก)<input id="s-pin" class="mono" inputmode="numeric" maxlength="8"></label>
    <label>ขอบเขตข้อสอบ<select id="s-cat">${opts}</select></label>
    <button class="btn primary sm" onclick="createSession()">สร้าง</button></div>
    <div class="err" id="s-err"></div></div>
  <div class="dcard"><h3>รอบสอบ</h3><div id="s-list"><small style="color:var(--muted)">กำลังโหลด…</small></div></div>
  <div id="r-area"></div>`;
}
async function createSession(){
  const t=document.getElementById('s-title').value.trim(),p=document.getElementById('s-pin').value.trim(),e=document.getElementById('s-err');
  if(!t) return e.textContent='ตั้งชื่อรอบสอบก่อน';
  if(!/^\d{4,8}$/.test(p)) return e.textContent='PIN เป็นตัวเลข 4–8 หลัก';
  e.textContent='';
  try{ const r=await api({a:'create',key:adminKey,title:t,pin:p,cat:+document.getElementById('s-cat').value});
    if(!r.ok) return e.textContent=r.err==='dup'?'PIN นี้ถูกใช้กับรอบที่เปิดอยู่แล้ว':'สร้างไม่สำเร็จ';
    document.getElementById('s-title').value='';document.getElementById('s-pin').value=''; selId=null; refresh();
  }catch(x){e.textContent='เชื่อมต่อระบบไม่ได้'}
}
async function toggleS(id,open){ await api({a:'toggle',key:adminKey,id,open}); refresh(); }
function drawSessions(){
  const el=document.getElementById('s-list'); if(!el) return;
  el.innerHTML=sessions.length?sessions.map(s=>{const n=results.filter(r=>r.sid===s.id).length;
   return `<div class="srow ${s.id===selId?'sel':''}" onclick="selId='${s.id}';drawSessions();drawResults()">
   <div class="sn">${esc(s.title)}<br><small>PIN ${esc(s.pin)} · ${s.cat>=0&&CATEGORIES[s.cat]?esc(CATEGORIES[s.cat].short):'ข้อสอบเต็ม'} · ส่งแล้ว ${n} ครั้ง</small></div>
   <span class="pill ${s.open?'':'off'}">${s.open?'เปิด':'ปิด'}</span>
   <button class="btn sm" onclick="event.stopPropagation();toggleS('${s.id}',${!s.open})">${s.open?'ปิดรับ':'เปิดรับ'}</button></div>`}).join(''):'<small style="color:var(--muted)">ยังไม่มีรอบสอบ สร้างรอบแรกด้านบน</small>';
}
function drawResults(){
  const el=document.getElementById('r-area'); if(!el) return;
  const s=sessions.find(x=>x.id===selId); if(!s){el.innerHTML='';return}
  const rs=results.filter(r=>r.sid===s.id).sort((a,b)=>b.pct-a.pct);
  const n=rs.length, avg=n?Math.round(rs.reduce((a,r)=>a+r.pct,0)/n):0, pass=n?Math.round(rs.filter(r=>r.pct>=60).length/n*100):0, top=n?rs[0].pct:0;
  const cats={}; rs.forEach(r=>Object.entries(r.perCat||{}).forEach(([k,v])=>{cats[k]=cats[k]||{c:0,t:0};cats[k].c+=v.c;cats[k].t+=v.t}));
  el.innerHTML=`<div class="dcard"><h3>ผลคะแนน — ${esc(s.title)}</h3>
  <div class="kpis"><div class="kpi"><b>${n}</b><span>ครั้งที่ส่ง</span></div><div class="kpi"><b>${avg}%</b><span>คะแนนเฉลี่ย</span></div><div class="kpi"><b>${top}%</b><span>สูงสุด</span></div><div class="kpi"><b>${pass}%</b><span>ผ่านเกณฑ์ 60%</span></div></div>
  ${n?`<div class="tw"><table><tr><th>#</th><th>ชื่อ</th><th>คะแนน</th><th>%</th><th>เวลาส่ง</th></tr>${rs.map((r,i)=>`<tr><td class="n">${i+1}</td><td>${esc(r.name)}</td><td class="n">${r.score}/${r.total}</td><td class="n" style="color:${r.pct>=60?'var(--green)':'var(--red)'}">${r.pct}%</td><td class="n">${new Date(r.ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:22px">ความแม่นรายหมวด (ทั้งรอบ)</h3>${Object.entries(cats).map(([k,v])=>{const p=Math.round(v.c/v.t*100);return `<div class="bd-row" style="margin-bottom:6px"><div class="bd-name">${esc(k)}</div><div class="hbar"><i style="width:${p}%"></i></div><div class="bd-score">${p}%</div></div>`}).join('')}
  <button class="btn sm" style="margin-top:14px" onclick="exportCsv()">ดาวน์โหลด CSV</button>`:'<small style="color:var(--muted)">ยังไม่มีนักเรียนส่งคะแนน — หน้านี้รีเฟรชเองทุก 8 วินาที</small>'}</div>`;
}
function exportCsv(){
  const s=sessions.find(x=>x.id===selId), rs=results.filter(r=>r.sid===selId).sort((a,b)=>b.pct-a.pct);
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv='\ufeffชื่อ,คะแนน,เต็ม,เปอร์เซ็นต์,เวลา\n'+rs.map(r=>[q(r.name),r.score,r.total,r.pct,q(new Date(r.ts).toLocaleString('th-TH'))].join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=(s?s.title:'results')+'.csv'; a.click();
}
</script>
</body>
</html>
